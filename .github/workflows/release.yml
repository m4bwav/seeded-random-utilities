# A tag v<version> (pushed by `npm version` and `git push --follow-tags`) on a master commit whose ci passed builds and tests
# the package, packs it once, checks that tarball's files and runs the consumer fixtures on it (Linux with Node 24 and 20,
# Windows), stages exactly that tarball on npm through trusted publishing, and creates the GitHub Release. Nothing goes live
# until Mark approves the staged version on npmjs.com with two-factor authentication; then run verify-published.yml
# with the version.
# `npm version` pushes the version commit and its tag together, so ci on that commit is still running when this starts: the
# build job waits for it (up to 30 minutes) and stops unless it succeeded (L-120, L-126 in package-modernize).
# No npm token exists anywhere: npm exchanges the job's OIDC token for a short-lived one, and adds provenance itself.
# The trusted publisher on npmjs.com names this file, release.yml; renaming it breaks publishing.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build and test the release
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tarball: ${{ steps.version.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: The tag must equal the package.json version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the package.json version $version"
            exit 1
          fi
          # A prerelease such as 2.0.0-beta.1 is staged under the next dist-tag, a release under latest.
          if [[ "$version" == *-* ]]; then
            echo "dist-tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=seeded-random-utilities-$version.tgz" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_SHA is not on master; tag only commits on master"
            exit 1
          fi
      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The lines under "## [<version>]" up to the next "## " heading.
          section() {
            awk -v heading="## [$1]" '
              /^## / { if (found) exit; found = (index($0, heading) == 1); next }
              found { print }
            ' CHANGELOG.md
          }
          notes=$(section "$VERSION")
          # A prerelease takes the section of the release it leads to: 2.0.0-beta.1 uses 2.0.0.
          if [ -z "$notes" ] && [[ "$VERSION" == *-* ]]; then
            notes=$(section "${VERSION%%-*}")
          fi
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          # A release needs its date in the heading, not "Unreleased".
          if [[ "$VERSION" != *-* ]] && ! grep -Eq "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::the CHANGELOG.md heading for $VERSION has no date"
            exit 1
          fi
          printf '%s\n' "$notes" > release-notes.md
      - name: ci passed on the tagged commit (waits up to 30 minutes for the run the same push started)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One verdict from gh's own jq, compared as an exact word, so a missing tool or an API error stops the job instead of passing it.
          verdict='if any(.check_runs[]; .conclusion == "success") then "success" elif (.check_runs | length) > 0 and all(.check_runs[]; .status == "completed") then "failed" else "waiting" end'
          for attempt in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci" --jq "$verdict") || state=error
            case "$state" in
              success)
                echo "ci succeeded on $GITHUB_SHA"
                exit 0
                ;;
              failed)
                echo "::error::ci finished on $GITHUB_SHA without success"
                exit 1
                ;;
              waiting)
                echo "waiting for ci on $GITHUB_SHA (attempt $attempt of 60)"
                sleep 30
                ;;
              *)
                echo "::error::could not read the ci check runs of $GITHUB_SHA ($state)"
                exit 1
                ;;
            esac
          done
          echo "::error::no finished ci check on $GITHUB_SHA after 30 minutes"
          exit 1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: The golden recordings, capture scripts and codec are unchanged since the commits that added them
        run: test/golden/check-untouched.sh
      - run: npm test
      - name: publint, attw and the pack file list
        run: npm run check
      - name: Pack the tarball that gets staged, once
        run: npm pack --ignore-scripts
      - name: The tarball's files, size and version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.version.outputs.tarball }}
        run: node test/package/check-tarball.mjs "$TARBALL" "$VERSION"
      - name: Consumer fixtures on the tarball that gets staged
        env:
          CONSUMER_PACKAGE: ${{ github.workspace }}/${{ steps.version.outputs.tarball }}
        run: node --test test/consumers/consumers.test.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            ${{ steps.version.outputs.tarball }}
            release-notes.md
          if-no-files-found: error

  consumers:
    name: consumers of the tarball to stage (Node ${{ matrix.node }}, ${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 20
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The fixtures install TypeScript and the Node types at the versions the checkout locks.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Node ${{ matrix.node }} to run the fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: The tarball's files, size and version
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: node test/package/check-tarball.mjs "$TARBALL" "$VERSION"
      - name: Consumer fixtures on the tarball that gets staged
        env:
          CONSUMER_PACKAGE: ${{ github.workspace }}/${{ needs.build.outputs.tarball }}
        run: node --test test/consumers/consumers.test.js

  publish:
    name: stage on npm
    needs: [build, consumers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can publish (id-token: write), so it installs nothing, runs no dependency code and uses only
    # first-party actions: it stages the tarball the build job tested. The GitHub Release is a separate job without id-token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm must be 11.15 or later to stage
        run: |
          npm --version
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); process.exit(major > 11 || (major === 11 && minor >= 15) ? 0 : 1)" "$(npm --version)"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Stage on npm for Mark's approval (the SHA-512 matches the one the build and consumers jobs printed)
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: |
          sha512sum "$TARBALL"
          npm stage publish "./$TARBALL" --tag "$DIST_TAG" --ignore-scripts

  github-release:
    name: GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: GitHub Release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.md "${flags[@]}"
